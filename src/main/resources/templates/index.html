<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Krofian Matrix Viewer</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/5.0.1/openseadragon.min.js"></script>
</head>
<body>

<header>

    <h1>AMViewer</h1>

</header>

<div class="container">

    <!-- Levý panel -->
    <aside class="sidebar">

        <h2>NOK kusy</h2>

        <div id="inspectionList"></div>

    </aside>

    <!-- Pravá část -->
    <main class="content">

        <div id="viewer"></div>

        <div class="toolbar">

            <button id="previousButton">
                ◀
            </button>

            <span id="imageName">
                Žádný snímek
            </span>

            <button id="nextButton">
                ▶
            </button>

            <button id="deleteButton" disabled>
                Smazat NOK
            </button>

        </div>

    </main>

</div>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
