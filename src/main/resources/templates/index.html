<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AMViewer</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/5.0.1/openseadragon.min.js"></script>
</head>
<body>

<header>

    <h1>AMViewer</h1>

</header>

<div class="container">

    <!-- Left panel -->
    <aside class="sidebar">

        <h2>NOK images</h2>

        <div id="inspectionList"></div>

    </aside>

    <!-- Right section -->
    <main class="content">

        <div id="viewer"></div>

        <div class="toolbar">

            <button id="previousButton" class="nok-button">
                NOK
            </button>

            <span id="imageName">
                No image
            </span>

            <button id="nextButton" class="ok-button">
                OK
            </button>

            <button id="deleteButton" disabled>
                Delete NOK image
            </button>

        </div>

    </main>

</div>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
