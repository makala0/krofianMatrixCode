<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AMViewer</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/5.0.1/openseadragon.min.js"></script>
</head>
<body>

<header>

    <h1>AMViewer</h1>

    <div class="language-switch" aria-label="Language">
        <button id="englishButton" type="button">EN</button>
        <button id="germanButton" type="button">DE</button>
    </div>

</header>

<div class="container">

    <main class="content">

        <div id="viewer"></div>

        <div class="toolbar">

            <span id="imageName">
                No image
            </span>

        </div>

    </main>

</div>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
